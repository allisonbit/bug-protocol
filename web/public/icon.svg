<svg width="64" height="64" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Favicon: the compact variant of components/brand.tsx on a graphite plate.
    Colours are literal because a favicon is fetched standalone and has no CSS
    custom properties to resolve. The mark is inset 4 of 32 so it keeps its
    breathing room down to 16px.

    The whole mark is lime here rather than lime-on-graphite: on a dark plate
    the light theme's deep-lime accent would disappear into the background, so
    hierarchy comes from opacity instead — the wave and the two surface nodes
    sit back, and the deep node is full strength, which is the one that matters.
  -->
  <rect width="32" height="32" rx="8" fill="#111111"/>
  <g transform="translate(4 4)">
    <path d="M3 8.6 Q6 6.1 9 8.6 T15 8.6 T21 8.6" stroke="#d4fc50" stroke-width="1.7" stroke-linecap="round" opacity="0.7"/>
    <g fill="#d4fc50" opacity="0.55">
      <circle cx="7.6" cy="14.4" r="2"/>
      <circle cx="16.4" cy="14.4" r="2"/>
    </g>
    <circle cx="12" cy="19.2" r="2.4" fill="#d4fc50"/>
  </g>
</svg>
